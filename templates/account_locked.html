<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account locked - PixMatch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="account-lock-body">
    <main class="account-lock-card">
        <div class="account-lock-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
        </div>
        <p class="eyebrow">ACCOUNT TEMPORARILY LOCKED</p>
        <h1>Enter your access code</h1>
        <p class="intro">Your account remains signed in, but website pages and services are unavailable until you enter the 6-character code from the administrator.</p>

        {% if error %}
        <p class="lock-form-error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="post" action="{{ url_for('account_unlock') }}" class="account-lock-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="unlock-code">6-character code</label>
            <input id="unlock-code" name="unlock_code" type="text" minlength="6" maxlength="6"
                pattern="[A-Za-z0-9]{6}" autocomplete="one-time-code" autocapitalize="characters"
                placeholder="ABC123" required autofocus>
            <button type="submit">Verify code</button>
        </form>
        <a class="lock-logout-link" href="{{ url_for('logout') }}">Sign out</a>
    </main>
</body>
</html>
