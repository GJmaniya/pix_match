<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin login - PixMatch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="admin-login-body">
    <main class="admin-login-card">
        <a class="admin-brand" href="{{ url_for('home') }}">PIX<span>MATCH</span></a>
        <p class="eyebrow">RESTRICTED ACCESS</p>
        <h1>Admin login</h1>
        <p class="intro">Sign in to view account activity.</p>

        {% if error %}
        <p class="login-error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="post" action="{{ url_for('admin_panel') }}" class="admin-login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Log in</button>
        </form>
    </main>
</body>
</html>
